# Minimal OpenTelemetry Collector for local tracing.
#
#   docker run --rm -p 4318:4318 -v "$PWD/infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml" \
#     otel/opentelemetry-collector:latest
#
# then start the backend with  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# Spans (one per HTTP request, Nest controller and middleware) are printed by the collector.
# Replace the `debug` exporter with Jaeger / Tempo / your vendor's exporter for real use.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
