# The backend is a standalone pnpm project (its own lockfile and node_modules).
# This file only carries pnpm settings; it does not link the frontend.
packages:
  - "."

# Dependencies that are allowed to run install/build scripts.
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
